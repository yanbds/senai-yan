<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Países</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161921;
            --card: #1e2230;
            --border: #2a2f42;
            --accent: #c9a84c;
            --accent2: #6eb5ff;
            --text: #e8eaf0;
            --muted: #7a7f96;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            padding: 48px 24px 32px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #11141c 0%, var(--bg) 100%);
        }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: -1px;
            color: var(--text);
        }
        header h1 span { color: var(--accent); }
        header p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 15px;
            font-weight: 300;
        }

        /* ── BUSCA ── */
        .search-wrap {
            max-width: 480px;
            margin: 32px auto 0;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color .2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        /* ── GRID ── */
        #paises-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 40px 24px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-pais {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform .18s, border-color .18s, box-shadow .18s;
            animation: fadeIn .4s ease both;
        }
        .card-pais:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 28px rgba(201,168,76,.18);
        }
        .card-pais img {
            width: 100%;
            aspect-ratio: 3/2;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .card-pais h3 {
            font-size: 13px;
            font-weight: 500;
            margin-top: 10px;
            color: var(--text);
            line-height: 1.3;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5,7,12,.85);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 760px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp .28s ease;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-hero {
            position: relative;
            height: 200px;
            overflow: hidden;
            border-radius: 20px 20px 0 0;
        }
        .modal-hero img.flag-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(14px) brightness(.45) saturate(1.4);
            transform: scale(1.1);
        }
        .modal-hero img.flag-main {
            position: absolute;
            inset: 0;
            margin: auto;
            height: 110px;
            width: auto;
            max-width: 70%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,.6);
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,.5);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }
        .modal-close:hover { background: rgba(201,168,76,.5); }

        .modal-body { padding: 28px 32px 36px; }
        .modal-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .modal-body .native-name {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .info-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .info-item .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 4px;
        }
        .info-item .value {
            font-size: 15px;
            font-weight: 400;
            color: var(--text);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin: 28px 0 14px;
            color: var(--accent2);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 5px 14px;
            font-size: 13px;
        }

        .coat-wrap {
            margin-top: 20px;
            text-align: center;
        }
        .coat-wrap img {
            max-height: 120px;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,.5));
        }

        /* spinner */
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 80px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* loading modal */
        .modal-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        @media (max-width: 520px) {
            .info-grid { grid-template-columns: 1fr; }
            .modal-body { padding: 20px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Explorador de <span>Países</span></h1>
    <p>Clique em um país para ver informações detalhadas</p>
    <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="busca" placeholder="Buscar país...">
    </div>
</header>

<div id="paises-container"><div class="spinner"></div></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
        <div class="modal-loading"><div class="spinner"></div></div>
    </div>
</div>

<script>
let todosPaises = [];

async function carregarPaises() {
    const container = document.getElementById('paises-container');
    try {
        const res = await fetch('https://restcountries.com/v3.1/all?fields=name,flags,cca3');
        if (!res.ok) throw new Error(res.status);
        todosPaises = await res.json();
        todosPaises.sort((a, b) => a.name.common.localeCompare(b.name.common));
        renderCards(todosPaises);
    } catch (e) {
        container.innerHTML = `<p style="color:red;padding:40px">Erro ao carregar países. Tente recarregar.</p>`;
    }
}

function renderCards(lista) {
    const container = document.getElementById('paises-container');
    if (!lista.length) {
        container.innerHTML = `<p style="color:var(--muted);padding:40px;grid-column:1/-1;text-align:center">Nenhum país encontrado.</p>`;
        return;
    }
    container.innerHTML = lista.map((p, i) => `
        <div class="card-pais" style="animation-delay:${Math.min(i * 0.015, 0.6)}s"
             onclick="abrirPais('${p.cca3}', '${escHtml(p.name.common)}', '${escHtml(p.flags.svg)}')">
            <img src="${p.flags.svg}" alt="Bandeira de ${escHtml(p.name.common)}" loading="lazy">
            <h3>${escHtml(p.name.common)}</h3>
        </div>
    `).join('');
}

function escHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── BUSCA ──
document.getElementById('busca').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    renderCards(q ? todosPaises.filter(p => p.name.common.toLowerCase().includes(q)) : todosPaises);
});

// ── MODAL ──
async function abrirPais(cca3, nome, flagUrl) {
    const overlay = document.getElementById('modal-overlay');
    const modal   = document.getElementById('modal');
    overlay.classList.add('open');
    modal.innerHTML = `<div class="modal-loading"><div class="spinner"></div></div>`;

    try {
        const res = await fetch(`https://restcountries.com/v3.1/alpha/${cca3}`);
        const [p]  = await res.json();
        modal.innerHTML = buildModal(p);
    } catch {
        modal.innerHTML = `<div style="padding:40px;color:red">Erro ao carregar detalhes.</div>
            <button class="modal-close" onclick="fecharModal()">✕</button>`;
    }
}

function buildModal(p) {
    const nome       = p.name.common;
    const nativo     = p.name.nativeName ? Object.values(p.name.nativeName)[0]?.common : '';
    const capital    = (p.capital || []).join(', ') || '—';
    const regiao     = [p.region, p.subregion].filter(Boolean).join(' › ');
    const pop        = p.population ? p.population.toLocaleString('pt-BR') : '—';
    const area       = p.area ? p.area.toLocaleString('pt-BR') + ' km²' : '—';
    const moeda      = p.currencies ? Object.values(p.currencies).map(c => `${c.name} (${c.symbol || ''})`).join(', ') : '—';
    const linguas    = p.languages ? Object.values(p.languages).join(', ') : '—';
    const fuso       = (p.timezones || []).join(', ') || '—';
    const dominio    = (p.tld || []).join(', ') || '—';
    const carro      = p.car?.side === 'left' ? '🚗 Esquerda' : '🚗 Direita';
    const fronteiras = (p.borders || []);
    const flag       = p.flags?.svg || p.flags?.png || '';
    const coat       = p.coatOfArms?.svg || p.coatOfArms?.png || '';
    const mapUrl     = p.maps?.googleMaps || '#';

    const bordersHtml = fronteiras.length
        ? fronteiras.map(b => `<span class="tag">${b}</span>`).join('')
        : '<span class="tag" style="color:var(--muted)">Nenhuma fronteira</span>';

    const coatHtml = coat
        ? `<div class="section-title">Brasão de Armas</div>
           <div class="coat-wrap"><img src="${coat}" alt="Brasão de ${escHtml(nome)}"></div>`
        : '';

    return `
        <div class="modal-hero">
            <img class="flag-bg" src="${flag}" alt="">
            <img class="flag-main" src="${flag}" alt="Bandeira de ${escHtml(nome)}">
            <button class="modal-close" onclick="fecharModal()">✕</button>
        </div>
        <div class="modal-body">
            <h2>${escHtml(nome)}</h2>
            ${nativo && nativo !== nome ? `<p class="native-name">${escHtml(nativo)}</p>` : '<p class="native-name" style="margin-bottom:24px"></p>'}

            <div class="info-grid">
                <div class="info-item"><div class="label">Capital</div><div class="value">${capital}</div></div>
                <div class="info-item"><div class="label">Região</div><div class="value">${regiao}</div></div>
                <div class="info-item"><div class="label">População</div><div class="value">${pop}</div></div>
                <div class="info-item"><div class="label">Área</div><div class="value">${area}</div></div>
                <div class="info-item"><div class="label">Moeda</div><div class="value">${moeda}</div></div>
                <div class="info-item"><div class="label">Idiomas</div><div class="value">${linguas}</div></div>
                <div class="info-item"><div class="label">Fuso Horário</div><div class="value">${fuso}</div></div>
                <div class="info-item"><div class="label">Domínio (.tld)</div><div class="value">${dominio}</div></div>
                <div class="info-item"><div class="label">Direção do trânsito</div><div class="value">${carro}</div></div>
                <div class="info-item">
                    <div class="label">Ver no mapa</div>
                    <div class="value">
                        <a href="${mapUrl}" target="_blank"
                           style="color:var(--accent2);text-decoration:none">
                           🗺️ Google Maps ↗
                        </a>
                    </div>
                </div>
            </div>

            <div class="section-title">Fronteiras</div>
            <div class="tags">${bordersHtml}</div>

            ${coatHtml}
        </div>
    `;
}

function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) fecharModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

document.addEventListener('DOMContentLoaded', carregarPaises);
</script>
</body>
</html>
